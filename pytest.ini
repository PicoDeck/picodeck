[pytest]
# Repo-level pytest config: covers `pytest`, `pytest tests/e2e` and
# `pytest tests/unit` from any directory inside the repo.
testpaths = tests/e2e tests/unit
markers =
    slow: long-running (stress) test
    hardware: needs a real PicoCalc (--target hw:<port>); skipped, allow-listed, on the simulator
    both: runs on the simulator and on --target hw; uses only the `target` fixture
    native: exercises a native (ELF) app
    asan_only: only meaningful under a sanitizer build of the simulator
    firmware_net: needs the simulator built with SIM_FIRMWARE_NET (make simulator-net)
    flaky: quarantined known flake (see tests/e2e/README.md); fix, don't retry
    sd(extra, fixtures, reserve): stage extra files onto the per-test SD card, pick which fixture apps it holds and reserve room for apps the test stages (see conftest.test_sd_card)
# Hung tests fail fast instead of eating the CI step timeout (pytest-timeout).
timeout = 60
# An xfail that starts passing fails the run, so fixed bugs drop their marker.
xfail_strict = true
# Keep only failing tests' tmp dirs (each test builds an SD card image).
tmp_path_retention_policy = failed
tmp_path_retention_count = 1

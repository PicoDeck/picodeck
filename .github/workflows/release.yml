name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    env:
      # OTA images must be signed (src/os/ota_verify.c).  The firmware embeds
      # the PUBLIC half of this key, derived below; the private key only ever
      # exists in $RUNNER_TEMP for the signing step.  Only whether the secret
      # is set is exposed job-wide, never its value.
      HAVE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
    steps:
      - name: Require the OTA update signing key
        if: env.HAVE_SIGNING_KEY != 'true'
        run: |
          echo "::error::The UPDATE_SIGNING_KEY secret is not set. A release must embed the real OTA public key (the default TEST key's private half is in the repo). Create one with 'python3 tools/sign_update.py genkey priv.pem pub.pem', add it with 'gh secret set UPDATE_SIGNING_KEY < priv.pem' and keep priv.pem safe; the key policy is under 'System update' in src/os/CLAUDE.md."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Fetch third-party dependencies
        run: |
          # Lua 5.4.7
          mkdir -p third_party/lua-5.4
          curl -fL https://www.lua.org/ftp/lua-5.4.7.tar.gz \
            | tar -xz --strip-components=1 -C third_party/lua-5.4/
          # Make luaconf.h honour the CMake Lua config (see cmake/picodeck_lua.cmake)
          cmake -DLUA_SRC_DIR=third_party/lua-5.4/src -P cmake/picodeck_lua.cmake

          # FatFS R0.15 — extracts upstream sources only.
          # ffconf.h and port/diskio_spi.c are project-specific and already
          # present from the checkout step.
          curl -fL https://elm-chan.org/fsw/ff/arc/ff15.zip -o /tmp/ff15.zip
          unzip -j /tmp/ff15.zip \
            'source/ff.c' 'source/ff.h' 'source/diskio.h' \
            'source/ffsystem.c' 'source/ffunicode.c' \
            -d third_party/fatfs/

      - name: Clone Pico SDK
        run: |
          git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          cd $HOME/pico-sdk && git submodule update --init --depth 1

      - name: Derive the OTA update public key
        if: env.HAVE_SIGNING_KEY == 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-signing.pem"
          openssl pkey -in "$RUNNER_TEMP/update-signing.pem" -noout -text \
            | grep -q prime256v1 || { echo "::error::UPDATE_SIGNING_KEY is not an EC P-256 key"; exit 1; }
          openssl pkey -in "$RUNNER_TEMP/update-signing.pem" -pubout \
            -out "$RUNNER_TEMP/update-public.pem"
          echo "OTA update public key:"; cat "$RUNNER_TEMP/update-public.pem"

      - name: Configure
        run: |
          mkdir build
          cmake -S . -B build \
            -DPICO_SDK_PATH=$HOME/pico-sdk \
            -DPICO_BOARD=pimoroni_pico_plus2_w_rp2350 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICODECK_UPDATE_PUBKEY_PEM="$RUNNER_TEMP/update-public.pem" \
            -DPICODECK_REQUIRE_RELEASE_UPDATE_KEY=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Generate SHA-256 hash
        run: |
          cd build
          sha256sum picodeck.bin | awk '{print $1}' > picodeck.sha256

      - name: Sign firmware (ECDSA P-256)
        if: env.HAVE_SIGNING_KEY == 'true'
        run: |
          python3 tools/sign_update.py sign build/picodeck.bin \
            --key "$RUNNER_TEMP/update-signing.pem" --out build/picodeck.sig
          python3 tools/sign_update.py verify build/picodeck.bin \
            --pub "$RUNNER_TEMP/update-public.pem" --sig build/picodeck.sig

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing.pem"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/picodeck.uf2
            build/picodeck.bin
            build/picodeck.sha256
            build/picodeck.sig

  build-simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            cmake \
            build-essential \
            libsdl2-dev \
            libsdl2-image-dev \
            libcurl4-openssl-dev

      - name: Fetch Lua
        run: |
          mkdir -p third_party/lua-5.4
          curl -fL https://www.lua.org/ftp/lua-5.4.7.tar.gz \
            | tar -xz --strip-components=1 -C third_party/lua-5.4/
          # Make luaconf.h honour the CMake Lua config (see cmake/picodeck_lua.cmake)
          cmake -DLUA_SRC_DIR=third_party/lua-5.4/src -P cmake/picodeck_lua.cmake

      - name: Build simulator
        run: make simulator

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: build_sim/picodeck_simulator

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Zip docs for picodeck.net
        run: |
          test -f docs/index.md && test -f docs/_sidebar.json
          cd docs && zip -qr ../picodeck-docs.zip .
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: picodeck-docs.zip

  release:
    needs: [build-firmware, build-simulator, build-docs]
    runs-on: ubuntu-latest
    env:
      # Rebuild picodeck.net once the assets are up (Cloudflare Pages deploy
      # hook); only whether the secret is set is exposed, not its value.
      HAVE_PAGES_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK != '' }}
      # PicoDeck/web-sim rebuilds the browser demo for each release; this
      # tells it at once (its daily check covers a missing token).
      HAVE_WEB_SIM_TOKEN: ${{ secrets.WEB_SIM_DISPATCH_TOKEN != '' }}
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/

      - name: Download simulator artifact
        uses: actions/download-artifact@v4
        with:
          name: simulator
          path: simulator/

      - name: Prepare simulator binary
        run: |
          chmod +x simulator/picodeck_simulator
          mv simulator/picodeck_simulator simulator/picodeck-simulator-linux

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: site/

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/picodeck.uf2
            firmware/picodeck.bin
            firmware/picodeck.sha256
            firmware/picodeck.sig
            simulator/picodeck-simulator-linux
            site/picodeck-docs.zip

      - name: Rebuild picodeck.net
        if: env.HAVE_PAGES_HOOK == 'true'
        env:
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$PAGES_DEPLOY_HOOK" > /dev/null

      # Runs after the Pages hook, and may fail, so a dead or unapproved
      # token never blocks PicoDeck's own site rebuild above. Web-sim's
      # daily follow check is the fallback if this dispatch doesn't land;
      # the step still goes red here so the token's owner sees it needs
      # renewing.
      - name: Tell PicoDeck/web-sim to rebuild the browser demo
        if: env.HAVE_WEB_SIM_TOKEN == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WEB_SIM_DISPATCH_TOKEN }}
        run: gh api repos/PicoDeck/web-sim/dispatches -f event_type=picodeck-release
